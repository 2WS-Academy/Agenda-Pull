<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Distribuidor de Pulls & Agenda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F4F5F9; --surface:#FFFFFF; --border:#E1E4EC;
    --text:#12172B; --text-soft:#636D87; --text-faint:#9AA1B5;
    --indigo:#493DEE; --indigo-ink:#2E23B8; --indigo-soft:#EDEBFE;
    --teal:#1EAAA3; --teal-ink:#137A75; --teal-soft:#E1F4F3;
    --green:#00C853; --green-soft:#E1FAEA;
    --amber:#C8862A; --amber-soft:#FBF0DF;
    --red:#D14343; --red-soft:#FCE9E9;
    --slate:#5C6480; --slate-soft:#EEF0F5;
    --sidebar-bg:#12172B; --sidebar-line:#252C48;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Sora',system-ui,sans-serif;}
  button{font-family:inherit;} input,select,textarea{font-family:inherit;font-size:14px;}
  .app{display:flex;min-height:100vh;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 15%, #1B2140 0%, #12172B 45%, #0D1122 100%);padding:20px;}
  .login-card{width:360px;max-width:100%;background:#fff;border-radius:16px;padding:30px 28px;box-shadow:0 30px 70px rgba(0,0,0,.35);}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .login-brand .name{font-family:'Sora';font-weight:700;font-size:16px;}
  .login-brand .sub{font-size:11.5px;color:var(--text-soft);margin-top:1px;}
  .login-error{background:var(--red-soft);color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .login-warn{background:var(--amber-soft);color:var(--amber);font-size:11.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;line-height:1.5;}

  .sidebar{width:236px;flex-shrink:0;background:var(--sidebar-bg);color:#fff;display:flex;flex-direction:column;padding:20px 16px;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px 6px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--indigo),var(--teal));flex-shrink:0;}
  .brand-text .name{font-family:'Sora';font-weight:700;font-size:14.5px;letter-spacing:.2px;}
  .brand-text .sub{font-size:11px;color:#8890AC;margin-top:1px;}
  .session-box{background:#1B2140;border:1px solid #2C3358;border-radius:10px;padding:12px 14px;margin-bottom:20px;}
  .session-box .who{font-weight:600;font-size:13px;}
  .session-box .rl{font-size:11px;color:#9096B5;margin-top:2px;margin-bottom:10px;}
  .session-box button{width:100%;background:transparent;border:1px solid #3A4270;color:#C6CAE0;padding:6px 0;border-radius:7px;font-size:11.5px;cursor:pointer;}
  .session-box button:hover{border-color:#565F96;color:#fff;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#B7BCD4;cursor:pointer;font-size:13.5px;font-weight:500;border:1px solid transparent;}
  .nav-item .dot{width:7px;height:7px;border-radius:50%;background:#4B5273;flex-shrink:0;}
  .nav-item:hover{background:#191F3C;color:#fff;}
  .nav-item.active{background:#1B2140;color:#fff;border-color:#2C3358;}
  .nav-item.active .dot.pulls{background:var(--indigo);}
  .nav-item.active .dot.agenda{background:var(--teal);}
  .nav-item.active .dot.dash{background:var(--green);}
  .nav-item .ext{margin-left:auto;font-size:10px;color:#7B82A6;}
  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--sidebar-line);font-size:11px;color:#6A729A;}

  .main{flex:1;min-width:0;padding:30px 36px 60px 36px;}
  .page-head{margin-bottom:26px;}
  .page-head h1{font-size:21px;margin:0 0 4px 0;font-weight:700;}
  .page-head p{margin:0;color:var(--text-soft);font-size:13.5px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:20px;}
  .panel h2{font-size:15px;margin:0 0 16px 0;font-weight:600;}
  .panel h2 small{display:block;font-weight:400;color:var(--text-faint);font-size:11.5px;margin-top:3px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  label.field-label{display:block;font-size:12px;color:var(--text-soft);margin-bottom:5px;font-weight:500;}
  .field{margin-bottom:14px;}
  input[type=text],input[type=password],input[type=date],input[type=time],input[type=file],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#FAFBFD;color:var(--text);}
  textarea{resize:vertical;min-height:56px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
  .helptext{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:9px;border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--indigo);color:#fff;} .btn-primary:hover{background:var(--indigo-ink);}
  .btn-teal{background:var(--teal);color:#fff;} .btn-teal:hover{background:var(--teal-ink);}
  .btn-outline{background:#fff;border-color:var(--border);color:var(--text);} .btn-outline:hover{border-color:var(--text-faint);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
  .btn-block{width:100%;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:0 10px 8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px;border-bottom:1px solid #EEF0F5;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.mono, .mono{font-family:'Sora';font-variant-numeric:tabular-nums;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge-green{background:var(--green-soft);color:#0A8A3D;} .badge-amber{background:var(--amber-soft);color:var(--amber);}
  .badge-red{background:var(--red-soft);color:var(--red);} .badge-slate{background:var(--slate-soft);color:var(--slate);}
  .badge-teal{background:var(--teal-soft);color:var(--teal-ink);} .badge-indigo{background:var(--indigo-soft);color:var(--indigo-ink);}
  .progress{height:7px;border-radius:5px;background:var(--slate-soft);overflow:hidden;margin:8px 0 4px 0;}
  .progress > div{height:100%;background:var(--indigo);} .progress.teal > div{background:var(--teal);}
  .kpi{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:#FAFBFD;}
  .kpi .n{font-family:'Sora';font-size:22px;font-weight:700;} .kpi .l{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px;}
  .filters .field{margin-bottom:0;min-width:150px;} .filters .field.narrow{min-width:120px;}
  .empty-state{padding:30px 10px;text-align:center;color:var(--text-faint);font-size:13px;}
  .divider-v{width:1px;background:var(--border);}
  .split{display:grid;grid-template-columns:1fr 1px 1fr;gap:24px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .actions-cell{display:flex;gap:6px;flex-wrap:wrap;}
  .actions-cell button{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:11.5px;color:var(--text-soft);cursor:pointer;}
  .actions-cell button:hover{border-color:var(--text-faint);color:var(--text);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(18,23,43,.45);display:flex;align-items:center;justify-content:center;z-index:120;}
  .modal{background:#fff;border-radius:14px;padding:22px;width:380px;max-width:90vw;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 14px 0;font-size:15px;}
  .spin-state{padding:24px;text-align:center;color:var(--text-faint);font-size:13px;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#D5D9E4;border-radius:6px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   CONFIGURACIÓN — pega aquí la URL de tu Web App de Apps Script (Code.gs)
   Implementar → Nueva implementación → Aplicación web → Acceso: Cualquier usuario
   ========================================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzadcCjJRkNbM9pUqbEE7BFJ82P-8ESyoFpUHtunhh3ygLQCbMvC6aq4yXXZgA4Elx8/exec";

const EQUIPOS_LABELS = { matutino: 'Equipo Matutino', vespertino: 'Equipo Vespertino' };
const EJECUTIVOS_LABELS = { juan: 'Juan Pérez', maria: 'María López', carlos: 'Carlos García', pedro: 'Pedro Sánchez' };
const ESTRATEGIAS = ['Mora 1', 'Mora 2', 'Mora Baja Preventiva', 'Reactivación'];
const ESTATUS_NEG = ['Seguimiento', 'Seguimiento a promesa', 'Recado tercero'];

/* ============================= API (ventana principal) ============================= */

function apiConfigured(){ return API_URL && API_URL.indexOf('http') === 0; }
async function apiGet(action, params){
  params = params || {};
  const qs = new URLSearchParams(Object.assign({ action: action }, params)).toString();
  const res = await fetch(API_URL + '?' + qs);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Error de servidor');
  return json.data;
}
async function apiPost(action, data){
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action: action, data: data }) });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Error de servidor');
  return json.data;
}

/* ============================= HELPERS ============================= */

const pad = n => String(n).padStart(2,'0');
const fmtDate = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function ejName(id){ return EJECUTIVOS_LABELS[id] || id; }
function estadoBadgeClass(estado){
  return {Vigente:'badge-indigo', Pendiente:'badge-amber', Vencida:'badge-red', Atendida:'badge-green', Cancelada:'badge-slate'}[estado] || 'badge-slate';
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function normalizeAgenda(a){
  const d = new Date(a.fechaISO);
  return { id:a.id, cuenta:a.cuenta, ejecutivo:a.ejecutivoId, estatus:a.estatus, fecha:fmtDate(d), hora:fmtTime(d), obs:a.obs, estado:a.estado, edits:a.ediciones||0, fechaObj:d };
}

/* ============================= STATE ============================= */

const state = {
  auth:null, loginError:'', loginLoading:false,
  role:null, currentEjecutivo:null,
  view:'agenda',
  pullWindowRef:null,
  agendaList:null, agendaLoading:false,
  dashboardData:null, dashboardLoading:false,
  agendaFilters:{estatus:'',estado:'',desde:'',hasta:'',cuenta:'',ejecutivo:'',equipo:''},
  agendaModal:null,
};

/* ============================= DATA LOADERS ============================= */

async function loadAgendas(){
  state.agendaLoading = true; render();
  try{
    const raw = await apiGet('getAgendas', { rol: state.role, ejecutivoId: state.currentEjecutivo || '' });
    state.agendaList = raw.map(normalizeAgenda);
  }catch(err){ showToast('Error al cargar Agenda: '+err.message); state.agendaList = []; }
  state.agendaLoading = false; render();
}
async function loadDashboard(){
  state.dashboardLoading = true; render();
  try{ state.dashboardData = await apiGet('getDashboard', {}); }
  catch(err){ showToast('Error al cargar Dashboard: '+err.message); }
  state.dashboardLoading = false; render();
}

/* ============================= VENTANA EMERGENTE DEL PULL ============================= */
/* Se abre como una ventana de navegador REAL (window.open), no como un div flotante,
   para que sí pueda quedar visible al lado del CRM en otra ventana. */

function openOrFocusPullWindow(){
  if(state.pullWindowRef && !state.pullWindowRef.closed){ state.pullWindowRef.focus(); return; }
  const isSup = state.role==='supervisor';
  const w = isSup ? 640 : 420, h = isSup ? 720 : 560;
  const win = window.open('', 'pullDistributor', `width=${w},height=${h},resizable=yes,scrollbars=yes`);
  if(!win){ showToast('El navegador bloqueó la ventana emergente. Permite pop-ups para este sitio.'); return; }
  state.pullWindowRef = win;

  const cfg = {
    apiUrl: API_URL, role: state.role, ejecutivoId: state.currentEjecutivo, nombre: state.auth.nombre,
    ejLabels: EJECUTIVOS_LABELS, eqLabels: EQUIPOS_LABELS, estrategias: ESTRATEGIAS,
  };
  const html =
    '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Distribuidor de Pulls</title>' +
    '<style>' + PULL_WIN_CSS + '</style></head><body>' +
    '<div id="root"></div><div class="toast" id="toast"></div>' +
    '<script>(' + pullWindowMain.toString() + ')(' + JSON.stringify(cfg) + ');</' + 'script>' +
    '</body></html>';
  win.document.open(); win.document.write(html); win.document.close();

  render(); // refresca el estado "activo" del nav item
}

const PULL_WIN_CSS = `
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{ --bg:#F4F5F9; --surface:#FFFFFF; --border:#E1E4EC; --text:#12172B; --text-soft:#636D87; --text-faint:#9AA1B5;
    --indigo:#493DEE; --indigo-ink:#2E23B8; --indigo-soft:#EDEBFE; --teal:#1EAAA3; --teal-ink:#137A75;
    --sidebar-bg:#12172B; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;}
  h2{font-family:'Sora';font-size:14.5px;margin:0 0 14px 0;font-weight:600;}
  h2 small{display:block;font-weight:400;color:var(--text-faint);font-size:11.5px;margin-top:3px;}
  .topbar{background:var(--sidebar-bg);color:#fff;padding:14px 18px;}
  .topbar .t{font-family:'Sora';font-weight:700;font-size:14px;}
  .topbar .s{font-size:11.5px;color:#9096B5;margin-top:2px;}
  .wrap{padding:16px 18px 40px 18px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;}
  .field{margin-bottom:12px;}
  label{display:block;font-size:11.5px;color:var(--text-soft);margin-bottom:5px;font-weight:500;}
  input[type=text],input[type=file],select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#FAFBFD;color:var(--text);font-size:13px;}
  input:focus,select:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
  .helptext{font-size:11px;color:var(--text-faint);margin-top:5px;}
  .chip-select{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-check{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:18px;padding:5px 10px;font-size:11.5px;cursor:pointer;background:#FAFBFD;user-select:none;}
  .chip-check.checked{background:var(--indigo-soft);border-color:var(--indigo);color:var(--indigo-ink);font-weight:600;}
  .chip-check input{display:none;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid transparent;font-size:12.5px;font-weight:600;cursor:pointer;}
  .btn-sm{padding:6px 10px;font-size:11.5px;}
  .btn-primary{background:var(--indigo);color:#fff;} .btn-primary:hover{background:var(--indigo-ink);}
  .btn-teal{background:var(--teal);color:#fff;} .btn-teal:hover{background:var(--teal-ink);}
  .btn-outline{background:#fff;border-color:var(--border);color:var(--text);} .btn-outline:hover{border-color:var(--text-faint);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}
  .sheet-row{display:flex;gap:8px;align-items:flex-end;}
  .sheet-row .field{flex:1;margin-bottom:0;}
  .account-card{border-radius:14px;padding:22px 18px;text-align:center;background:linear-gradient(180deg,var(--indigo-soft),#fff 65%);border:1px solid var(--border);}
  .account-card .eyebrow{font-size:11px;color:var(--indigo-ink);font-weight:600;margin-bottom:8px;}
  .account-card .number{font-family:'Sora';font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:14px;}
  .account-card .empty{font-size:12.5px;color:var(--text-faint);margin-bottom:14px;padding:14px 0;}
  .account-card .meta{margin-top:10px;font-size:11.5px;color:var(--text-soft);}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;font-size:10px;color:var(--text-faint);font-weight:600;text-transform:uppercase;padding:0 8px 6px 8px;border-bottom:1px solid var(--border);}
  td{padding:8px;border-bottom:1px solid #EEF0F5;} tr:last-child td{border-bottom:none;}
  .mono{font-family:'Sora';font-variant-numeric:tabular-nums;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;background:var(--indigo-soft);color:var(--indigo-ink);}
  .progress{height:6px;border-radius:5px;background:#EEF0F5;overflow:hidden;margin:6px 0 4px 0;}
  .progress > div{height:100%;background:var(--indigo);}
  .pull-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .pull-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .pull-card .title{font-weight:600;font-size:13px;}
  .pull-card .sub{font-size:11px;color:var(--text-soft);margin-top:2px;}
  .pull-card .stats{display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--text-soft);flex-wrap:wrap;}
  .pull-card .stats b{color:var(--text);font-family:'Sora';}
  .empty-state{padding:20px 10px;text-align:center;color:var(--text-faint);font-size:12px;}
  .spin-state{padding:20px;text-align:center;color:var(--text-faint);font-size:12px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:8px;font-size:11.5px;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
`;

/**
 * Todo el contenido de esta función se serializa con .toString() y se ejecuta
 * DENTRO de la ventana emergente — no comparte variables con la página principal,
 * solo lo que le llega por CFG (rol, ejecutivo, catálogos, URL del backend).
 */
function pullWindowMain(CFG){
  const pad = n => String(n).padStart(2,'0');
  const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const genCuenta = () => '558' + Math.floor(1000000 + Math.random()*8999999);
  const ejName = id => CFG.ejLabels[id] || id;
  const equipoName = id => CFG.eqLabels[id] || id;

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(showToast._t); showToast._t = setTimeout(()=>t.classList.remove('show'), 2000);
  }
  async function apiGet(action, params){
    params = params || {};
    const qs = new URLSearchParams(Object.assign({ action: action }, params)).toString();
    const res = await fetch(CFG.apiUrl + '?' + qs);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Error de servidor');
    return json.data;
  }
  async function apiPost(action, data){
    const res = await fetch(CFG.apiUrl, { method:'POST', body: JSON.stringify({ action, data }) });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Error de servidor');
    return json.data;
  }

  const state = { pulls:null, historial:null, loading:false, createOpen:false, saving:false, pending:[], pendingGroups:null };
  const isSup = CFG.role === 'supervisor';

  async function load(){
    state.loading = true; render();
    try{
      const [pulls, historial] = await Promise.all([
        apiGet('getPulls', { rol: CFG.role, ejecutivoId: CFG.ejecutivoId || '' }),
        isSup ? apiGet('getHistorial', { limit: 8 }) : Promise.resolve(null),
      ]);
      state.pulls = pulls; state.historial = historial;
    }catch(err){ showToast('Error: '+err.message); state.pulls = []; }
    state.loading = false; render();
  }

  function render(){
    document.getElementById('root').innerHTML = `
      <div class="topbar">
        <div class="t">Distribuidor de Pulls</div>
        <div class="s">${CFG.nombre} · ${isSup ? 'Supervisor' : 'Agente'}</div>
      </div>
      <div class="wrap">
        ${state.loading || state.pulls===null ? `<div class="spin-state">Cargando…</div>` : (isSup ? renderSupervisor() : renderEjecutivo())}
      </div>`;
    bind();
  }

  function renderSupervisor(){
    const pulls = state.pulls || [];
    return `
    <div class="panel">
      <h2>Pulls activos</h2>
      ${pulls.length===0 ? `<div class="empty-state">Aún no hay Pulls creados.</div>` : pulls.map(p=>{
        const st = p.stats, pct = st.total ? Math.round((st.tomadas/st.total)*100) : 0;
        return `
        <div class="pull-card">
          <div class="top">
            <div><div class="title">${p.nombre}</div><div class="sub">${p.estrategia} · ${equipoName(p.equipo)} · ${p.ejecutivos.map(ejName).join(', ')}</div></div>
            <span class="badge">${st.disponibles} disp.</span>
          </div>
          <div class="progress"><div style="width:${pct}%"></div></div>
          <div class="stats"><div><b>${st.total}</b> total</div><div><b>${st.tomadas}</b> tomadas</div>
            ${Object.entries(p.byEjecutivo).map(([ej,n])=>`<div>${ejName(ej)}: <b>${n}</b></div>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="panel">
      <h2>Crear Pull <small>Cargar base de cuentas y definir a quién se asigna</small></h2>
      ${state.createOpen ? renderCreateForm() : `<button class="btn btn-primary" id="openCreate">+ Nuevo Pull</button>`}
    </div>
    <div class="panel">
      <h2>Historial reciente</h2>
      ${state.historial && state.historial.length ? `
      <table><thead><tr><th>Cuenta</th><th>Pull</th><th>Ejecutivo</th><th>Hora</th></tr></thead>
        <tbody>${state.historial.map(h=>{ const d=new Date(h.fechaAsignacion); return `<tr><td class="mono">${h.cuenta}</td><td>${h.pull}</td><td>${ejName(h.ejecutivo)}</td><td>${fmtTime(d)}</td></tr>`; }).join('')}</tbody>
      </table>` : `<div class="empty-state">Aún no se han entregado cuentas.</div>`}
    </div>`;
  }

  function renderCreateForm(){
    const pend = state.pending.length;
    return `
    <div class="field"><label>Nombre del Pull <span style="font-weight:400;color:var(--text-faint);">(ignorado si el archivo trae varios pulls)</span></label><input type="text" id="np-nombre" placeholder="Ej. ESTRATEGIA MORA 2 SEPTIEMBRE"></div>
    <div class="field"><label>Estrategia</label><select id="np-estrategia">${CFG.estrategias.map(s=>`<option>${s}</option>`).join('')}</select></div>
    <div class="field">
      <label>Base de cuentas</label>
      <div class="btn-row" style="margin-bottom:8px;">
        <button class="btn btn-outline btn-sm" id="dlTemplate">↓ Plantilla</button>
        <label class="btn btn-outline btn-sm" style="cursor:pointer;">Subir archivo<input type="file" id="np-file" accept=".csv,.txt,.xlsx,.xls" style="display:none;"></label>
      </div>
      <div class="helptext" style="margin-bottom:8px;">Columna A = nombre del Pull · Columna B = cuenta. Si subes varias filas con nombres distintos en la columna A, se crea <b>un Pull por cada nombre</b> automáticamente, todos con el equipo/ejecutivos que elijas abajo.</div>
      <div class="sheet-row">
        <div class="field"><label style="font-weight:400;">o Google Sheets (CSV publicado)</label><input type="text" id="np-sheet" placeholder="https://docs.google.com/.../pub?output=csv"></div>
        <button class="btn btn-teal btn-sm" id="np-import">Importar</button>
      </div>
      <div class="helptext" id="np-status">${pend ? `${pend} cuentas listas.` : 'Sin base — se generarán 20 cuentas de ejemplo si no subes ni importas.'}</div>
    </div>
    <div class="field"><label>Asignar a equipo</label>
      <select id="np-equipo"><option value="">— Sin equipo —</option>${Object.entries(CFG.eqLabels).map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select></div>
    <div class="field"><label>Ejecutivos específicos</label>
      <div class="chip-select" id="np-ejs">${Object.entries(CFG.ejLabels).map(([id,n])=>`<label class="chip-check"><input type="checkbox" value="${id}"> ${n}</label>`).join('')}</div></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="submitCreate" ${state.saving?'disabled':''}>${state.saving ? 'Creando…' : (state.pendingGroups ? `Crear ${Object.keys(state.pendingGroups).length} Pulls` : 'Crear Pull')}</button>
      <button class="btn btn-outline" id="cancelCreate">Cancelar</button>
    </div>`;
  }

  function renderEjecutivo(){
    const pulls = state.pulls || [];
    if(pulls.length===0) return `<div class="empty-state">No tienes Pulls asignados.</div>`;
    return `
    <div class="field"><label>Pull</label><select id="pullSelect">${pulls.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('')}</select></div>
    <div id="accountZone">${renderAccountZone(pulls[0])}</div>`;
  }
  function renderAccountZone(pull){
    if(!pull) return '';
    const st = pull.stats;
    return `
    <div class="account-card">
      <div class="eyebrow">CUENTA ASIGNADA</div>
      ${pull.miUltimaCuenta ? `<div class="number">${pull.miUltimaCuenta}</div>` : `<div class="empty">Sin cuenta asignada — presiona "Siguiente cuenta".</div>`}
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-outline" id="copyBtn" ${pull.miUltimaCuenta?'':'disabled'}>Copiar cuenta</button>
        <button class="btn btn-primary" id="nextBtn" ${st.disponibles===0?'disabled':''}>Siguiente cuenta</button>
      </div>
      <div class="meta">Trabajadas: <b>${pull.miTrabajadas}</b> · Disponibles: <b>${st.disponibles}</b></div>
    </div>`;
  }

  function bind(){
    const openCreate = document.getElementById('openCreate');
    if(openCreate) openCreate.onclick = () => { state.createOpen = true; render(); };
    const cancelCreate = document.getElementById('cancelCreate');
    if(cancelCreate) cancelCreate.onclick = () => { state.createOpen = false; state.pending = []; state.pendingGroups = null; render(); };

    document.querySelectorAll('.chip-check').forEach(chip=>{
      chip.onclick = () => { chip.classList.toggle('checked'); chip.querySelector('input').checked = chip.classList.contains('checked'); };
    });

    const dlBtn = document.getElementById('dlTemplate');
    if(dlBtn) dlBtn.onclick = () => {
      const csv = "nombre_pull,numero_cuenta\nESTRATEGIA MORA 2 SEPTIEMBRE,5582585154\nESTRATEGIA MORA 2 SEPTIEMBRE,5582585155\nESTRATEGIA CASTIGO SEPTIEMBRE,5582585156\nESTRATEGIA CASTIGO SEPTIEMBRE,5582585157\n";
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='plantilla_pull.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    };

    // Convierte filas [ [nombrePull?, cuenta?], ... ] en:
    //  - state.pendingGroups = {nombrePull: [cuentas...]}  cuando hay 2+ columnas con nombres
    //  - state.pending = [cuentas...]                       cuando sólo hay una columna de cuentas
    function applyRows(rows, sourceLabel, statusEl){
      const groups = {};
      let singleCol = [];
      rows.forEach(row=>{
        if(!row || row.length===0) return;
        const col0 = String(row[0]==null?'':row[0]).trim();
        const col1 = row.length>1 ? String(row[1]==null?'':row[1]).trim() : '';
        if(col1 && /^\d{6,}$/.test(col1)){
          const nombrePull = col0 || 'Pull sin nombre';
          (groups[nombrePull] = groups[nombrePull] || []).push(col1);
        } else if(!col1 && /^\d{6,}$/.test(col0)){
          singleCol.push(col0);
        }
      });
      const nombresDetectados = Object.keys(groups);
      if(nombresDetectados.length >= 2){
        state.pendingGroups = groups;
        state.pending = [];
        const total = nombresDetectados.reduce((s,n)=>s+groups[n].length,0);
        statusEl.innerHTML = `<b>${nombresDetectados.length} Pulls</b> detectados en "${sourceLabel}" (${total} cuentas en total):<br>` +
          nombresDetectados.map(n=>`· ${n} — ${groups[n].length} cuentas`).join('<br>');
        render(); // refresca para mostrar el resumen y renombrar el botón de crear
      } else if(nombresDetectados.length === 1 && singleCol.length === 0){
        // una sola columna de nombre repetido + cuentas → también cuenta como un pull normal
        state.pendingGroups = null;
        state.pending = groups[nombresDetectados[0]];
        statusEl.textContent = `${state.pending.length} cuentas listas para el Pull "${nombresDetectados[0]}".`;
        const nombreInput = document.getElementById('np-nombre');
        if(nombreInput && !nombreInput.value) nombreInput.value = nombresDetectados[0];
      } else {
        state.pendingGroups = null;
        state.pending = singleCol;
        statusEl.textContent = singleCol.length ? `${singleCol.length} cuentas detectadas en "${sourceLabel}".` : 'No se detectaron cuentas válidas. Revisa que la columna A sea el nombre del Pull y la B la cuenta.';
      }
    }

    const fileInput = document.getElementById('np-file');
    if(fileInput) fileInput.onchange = () => {
      const f = fileInput.files[0]; const statusEl = document.getElementById('np-status');
      if(!f) return;
      const name = f.name.toLowerCase();
      if(name.endsWith('.xlsx') || name.endsWith('.xls')){
        const reader = new FileReader();
        reader.onload = () => {
          try{
            const wb = XLSX.read(new Uint8Array(reader.result), {type:'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
            applyRows(rows, f.name, statusEl);
          }catch(err){ statusEl.textContent = 'No se pudo leer el Excel: '+err.message; }
        };
        reader.readAsArrayBuffer(f);
      } else {
        const reader = new FileReader();
        reader.onload = () => {
          const rows = String(reader.result).split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length).map(l=>l.split(/,|\t/).map(c=>c.replace(/^"|"$/g,'').trim()));
          applyRows(rows, f.name, statusEl);
        };
        reader.readAsText(f);
      }
    };

    const importBtn = document.getElementById('np-import');
    if(importBtn) importBtn.onclick = async () => {
      const url = document.getElementById('np-sheet').value.trim();
      const statusEl = document.getElementById('np-status');
      if(!url){ statusEl.textContent = 'Pega primero el enlace de Google Sheets publicado como CSV.'; return; }
      statusEl.textContent = 'Importando…';
      try{
        const res = await fetch(url);
        if(!res.ok) throw new Error('http '+res.status);
        const text = await res.text();
        const rows = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length).map(l=>l.split(',').map(c=>c.replace(/^"|"$/g,'').trim()));
        applyRows(rows, 'Google Sheets', statusEl);
      }catch(err){ statusEl.textContent = 'No se pudo leer la hoja. Verifica que esté publicada en la web como CSV.'; }
    };

    const submitBtn = document.getElementById('submitCreate');
    if(submitBtn) submitBtn.onclick = async () => {
      const estrategia = document.getElementById('np-estrategia').value;
      const equipo = document.getElementById('np-equipo').value;
      const ejecutivos = Array.from(document.querySelectorAll('#np-ejs input:checked')).map(i=>i.value);
      if(!equipo && ejecutivos.length===0){ showToast('Asigna al menos un equipo o ejecutivo.'); return; }

      if(state.pendingGroups && Object.keys(state.pendingGroups).length){
        // Modo múltiple: un Pull por cada nombre detectado en la columna A del archivo
        const entries = Object.entries(state.pendingGroups);
        state.saving = true; render();
        let creados = 0, totalCuentas = 0, errores = [];
        for(const [nombre, cuentas] of entries){
          try{
            await apiPost('crearPull', { nombre, estrategia, equipo, ejecutivos, cuentas });
            creados++; totalCuentas += cuentas.length;
          }catch(err){ errores.push(`${nombre}: ${err.message}`); }
        }
        state.createOpen = false; state.pending = []; state.pendingGroups = null; state.saving = false;
        showToast(errores.length
          ? `${creados}/${entries.length} Pulls creados (${totalCuentas} cuentas). Errores: ${errores.join(' · ')}`
          : `${creados} Pulls creados con ${totalCuentas} cuentas en total.`);
        await load();
        return;
      }

      const nombre = document.getElementById('np-nombre').value.trim();
      if(!nombre){ showToast('Ponle un nombre al Pull.'); return; }
      const cuentas = state.pending.length ? state.pending : Array.from({length:20}, genCuenta);
      state.saving = true; render();
      try{
        await apiPost('crearPull', { nombre, estrategia, equipo, ejecutivos, cuentas });
        state.createOpen = false; state.pending = []; state.saving = false;
        showToast(`Pull "${nombre}" creado con ${cuentas.length} cuentas.`);
        await load();
      }catch(err){ state.saving=false; showToast('Error: '+err.message); render(); }
    };

    const pullSelect = document.getElementById('pullSelect');
    if(pullSelect){
      pullSelect.onchange = () => {
        const pull = (state.pulls||[]).find(p=>p.id===pullSelect.value);
        const zone = document.getElementById('accountZone');
        zone.innerHTML = renderAccountZone(pull); bindZone(pull);
      };
      bindZone((state.pulls||[])[0]);
    }
  }

  function bindZone(pull){
    if(!pull) return;
    const copyBtn = document.getElementById('copyBtn');
    const nextBtn = document.getElementById('nextBtn');
    if(copyBtn) copyBtn.onclick = () => {
      if(!pull.miUltimaCuenta) return;
      navigator.clipboard?.writeText(pull.miUltimaCuenta).catch(()=>{});
      showToast(`Cuenta ${pull.miUltimaCuenta} copiada.`);
    };
    if(nextBtn) nextBtn.onclick = async () => {
      nextBtn.disabled = true; nextBtn.textContent = 'Asignando…';
      try{
        await apiPost('siguienteCuenta', { pullId: pull.id, ejecutivoId: CFG.ejecutivoId });
        await load();
        const fresh = (state.pulls||[]).find(p=>p.id===pull.id);
        const zone = document.getElementById('accountZone');
        if(zone && fresh){ zone.innerHTML = renderAccountZone(fresh); bindZone(fresh); }
      }catch(err){ showToast('Error: '+err.message); nextBtn.disabled=false; nextBtn.textContent='Siguiente cuenta'; }
    };
  }

  load();
}

/* ============================= RENDER (ventana principal) ============================= */

function render(){
  if(!state.auth){ renderLoginScreen(); return; }
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="app">
      ${renderSidebar()}
      <div class="main">
        ${state.view==='agenda' ? renderAgenda() : ''}
        ${state.view==='dashboard' && state.role==='supervisor' ? renderDashboard() : ''}
      </div>
    </div>
    ${state.agendaModal ? renderAgendaModal() : ''}
  `;
  bindEvents();
}

function renderLoginScreen(){
  const root = document.getElementById('root');
  root.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand"><div class="brand-mark"></div>
        <div><div class="name">Pulls &amp; Agenda</div><div class="sub">Operación Telmex · Cobranza</div></div></div>
      ${!apiConfigured() ? `<div class="login-warn">⚠ Falta configurar <b>API_URL</b> en el archivo con la URL de tu Web App de Apps Script.</div>` : ''}
      ${state.loginError ? `<div class="login-error">${state.loginError}</div>` : ''}
      <div class="field"><label class="field-label">Usuario</label><input type="text" id="login-user" placeholder="tu.usuario" autocomplete="username"></div>
      <div class="field"><label class="field-label">Contraseña</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" id="login-submit" ${state.loginLoading?'disabled':''}>${state.loginLoading?'Ingresando…':'Ingresar'}</button>
    </div>
  </div>`;

  const doLogin = async () => {
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value;
    if(!apiConfigured()){ state.loginError = 'Configura primero API_URL en el archivo.'; render(); return; }
    state.loginLoading = true; state.loginError=''; render();
    try{
      const user = await apiGet('login', { usuario:u, password:p });
      state.auth = user; state.role = user.rol; state.currentEjecutivo = user.ejecutivo_id || null;
      state.view = user.rol==='supervisor' ? 'dashboard' : 'agenda';
      state.loginLoading = false;
      if(state.view==='dashboard') await loadDashboard(); else await loadAgendas();
    }catch(err){ state.loginLoading = false; state.loginError = err.message || 'No se pudo iniciar sesión.'; render(); }
  };
  document.getElementById('login-submit').onclick = doLogin;
  document.getElementById('login-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('login-user').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

function renderSidebar(){
  const isSup = state.role==='supervisor';
  const pullOpen = state.pullWindowRef && !state.pullWindowRef.closed;
  return `
  <div class="sidebar">
    <div class="brand"><div class="brand-mark"></div>
      <div class="brand-text"><div class="name">Pulls &amp; Agenda</div><div class="sub">Operación Telmex · Cobranza</div></div></div>
    <div class="session-box">
      <div class="who">${state.auth.nombre}</div>
      <div class="rl">${isSup?'Perfil: Supervisor':'Perfil: Agente'}</div>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
    <div class="nav">
      <div class="nav-item ${pullOpen?'active':''}" data-action="openPull"><span class="dot pulls"></span>Distribuidor de Pulls<span class="ext">↗</span></div>
      <div class="nav-item ${state.view==='agenda'?'active':''}" data-view="agenda"><span class="dot agenda"></span>${isSup?'Agenda':'Mi Agenda'}</div>
      ${isSup ? `<div class="nav-item ${state.view==='dashboard'?'active':''}" data-view="dashboard"><span class="dot dash"></span>Dashboard</div>` : ''}

    <div class="sidebar-foot">"Distribuidor de Pulls" abre una ventana aparte que puedes acomodar junto al CRM. Conectado a Google Sheets vía Apps Script.</div>

/* ---------------- AGENDA VIEW ---------------- */
function renderAgenda(){
  if(state.agendaLoading || state.agendaList===null) return `<div class="page-head"><h1>${state.role==='supervisor'?'Agenda':'Mi Agenda'}</h1></div><div class="panel"><div class="spin-state">Cargando agendas…</div></div>`;
  return state.role==='supervisor' ? renderAgendaSupervisor() : renderAgendaEjecutivo();
}
function agendaKpis(list){
  const c = f => list.filter(f).length;
  return { total:list.length, vigentes:c(a=>a.estado==='Vigente'), pendientes:c(a=>a.estado==='Pendiente'),
    vencidas:c(a=>a.estado==='Vencida'), atendidas:c(a=>a.estado==='Atendida'), canceladas:c(a=>a.estado==='Cancelada'),
    seguimiento:c(a=>a.estatus==='Seguimiento'), promesa:c(a=>a.estatus==='Seguimiento a promesa'), recado:c(a=>a.estatus==='Recado tercero') };
}
function filteredAgendas(baseList){
  const f = state.agendaFilters;
  return baseList.filter(a=>{
    if(f.estatus && a.estatus!==f.estatus) return false;
    if(f.estado && a.estado!==f.estado) return false;
    if(f.cuenta && !a.cuenta.includes(f.cuenta.trim())) return false;
    if(f.ejecutivo && a.ejecutivo!==f.ejecutivo) return false;
    if(f.desde && a.fechaObj < new Date(f.desde)) return false;
    if(f.hasta && a.fechaObj > new Date(f.hasta+'T23:59:59')) return false;
    return true;
  });
}
function renderAgendaEjecutivo(){
  const list = filteredAgendas(state.agendaList);
  return `
  <div class="page-head"><h1>Mi Agenda</h1><p>Seguimiento de negociaciones — ${ejName(state.currentEjecutivo)}</p></div>
  <div class="panel">
    <div class="btn-row" style="margin-bottom:16px;"><button class="btn btn-teal" id="newAgendaBtn">+ Nueva Agenda</button></div>
    <div class="filters">${agendaFilterFields(false)}</div>
    ${renderAgendaTable(list, true)}
  </div>`;
}
function renderAgendaSupervisor(){
  const list = filteredAgendas(state.agendaList);
  const k = agendaKpis(list);
  return `
  <div class="page-head"><h1>Agenda — vista de supervisor</h1><p>Seguimiento de negociaciones de todo el equipo, independiente del Pull.</p></div>
  <div class="panel">
    <h2>Resumen</h2>
    <div class="grid-3" style="margin-bottom:14px;">
      <div class="kpi"><div class="n">${k.total}</div><div class="l">Total agendas</div></div>
      <div class="kpi"><div class="n">${k.vigentes}</div><div class="l">Vigentes</div></div>
      <div class="kpi"><div class="n">${k.pendientes}</div><div class="l">Pendientes</div></div>
      <div class="kpi"><div class="n">${k.vencidas}</div><div class="l">Vencidas</div></div>
      <div class="kpi"><div class="n">${k.atendidas}</div><div class="l">Atendidas</div></div>
      <div class="kpi"><div class="n">${k.canceladas}</div><div class="l">Canceladas</div></div>
    </div>
    <div class="grid-3">
      <div class="kpi"><div class="n">${k.seguimiento}</div><div class="l">Seguimiento</div></div>
      <div class="kpi"><div class="n">${k.promesa}</div><div class="l">Seguimiento a promesa</div></div>
      <div class="kpi"><div class="n">${k.recado}</div><div class="l">Recado tercero</div></div>
    </div>
  </div>
  <div class="panel">
    <h2>Todas las agendas</h2>
    <div class="filters">${agendaFilterFields(true)}</div>
    ${renderAgendaTable(list, false)}
  </div>`;
}
function agendaFilterFields(withEjecutivo){
  const f = state.agendaFilters;
  return `
    <div class="field narrow"><label class="field-label">Estatus</label><select id="f-estatus"><option value="">Todos</option>${ESTATUS_NEG.map(s=>`<option ${f.estatus===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field narrow"><label class="field-label">Estado</label><select id="f-estado"><option value="">Todos</option>${['Vigente','Pendiente','Vencida','Atendida','Cancelada'].map(s=>`<option ${f.estado===s?'selected':''}>${s}</option>`).join('')}</select></div>
    ${withEjecutivo ? `
    <div class="field narrow"><label class="field-label">Ejecutivo</label><select id="f-ejecutivo"><option value="">Todos</option>${Object.entries(EJECUTIVOS_LABELS).map(([id,n])=>`<option value="${id}" ${f.ejecutivo===id?'selected':''}>${n}</option>`).join('')}</select></div>` : ''}
    <div class="field narrow"><label class="field-label">Cuenta</label><input type="text" id="f-cuenta" placeholder="Buscar…" value="${f.cuenta}"></div>
    <div class="field narrow"><label class="field-label">Desde</label><input type="date" id="f-desde" value="${f.desde}"></div>
    <div class="field narrow"><label class="field-label">Hasta</label><input type="date" id="f-hasta" value="${f.hasta}"></div>
    <button class="btn btn-outline" id="clearFilters">Limpiar</button>
  `;
}
function renderAgendaTable(list, showActions){
  if(!list.length) return `<div class="empty-state">No hay agendas que coincidan con los filtros.</div>`;
  list.sort((a,b)=>a.fechaObj-b.fechaObj);
  return `
  <table><thead><tr><th>Cuenta</th><th>Ejecutivo</th><th>Estatus</th><th>Fecha</th><th>Hora</th><th>Estado</th><th>Observaciones</th>${showActions?'<th>Acciones</th>':''}</tr></thead>
    <tbody>${list.map(a=>`
      <tr>
        <td class="mono">${a.cuenta}</td><td>${ejName(a.ejecutivo)}</td>
        <td><span class="badge badge-slate">${a.estatus}</span></td><td>${a.fecha}</td><td>${a.hora}</td>
        <td><span class="badge ${estadoBadgeClass(a.estado)}">${a.estado}${a.edits?` · ${a.edits}× editada`:''}</span></td>
        <td style="max-width:220px;color:var(--text-soft);">${a.obs || '—'}</td>
        ${showActions ? `<td><div class="actions-cell">
          ${a.estado==='Vigente'||a.estado==='Pendiente' ? `<button data-act="atender" data-id="${a.id}">Atendida</button>` : ''}
          ${a.estado!=='Cancelada'&&a.estado!=='Atendida' ? `<button data-act="reprogramar" data-id="${a.id}">Reprogramar</button>` : ''}
          ${a.estado!=='Cancelada'&&a.estado!=='Atendida' ? `<button data-act="cancelar" data-id="${a.id}">Cancelar</button>` : ''}
        </div></td>` : ''}
      </tr>`).join('')}
    </tbody></table>`;
}
function renderAgendaModal(){
  const m = state.agendaModal;
  if(m.mode==='new'){
    return `
    <div class="modal-backdrop" id="modalBackdrop"><div class="modal">
      <h3>Nueva Agenda</h3>
      <div class="field"><label class="field-label">Cuenta</label><input type="text" id="ag-cuenta" placeholder="Número de cuenta"></div>
      <div class="field"><label class="field-label">Estatus</label><select id="ag-estatus">${ESTATUS_NEG.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="grid-2"><div class="field"><label class="field-label">Fecha</label><input type="date" id="ag-fecha"></div>
        <div class="field"><label class="field-label">Hora</label><input type="time" id="ag-hora" value="10:00"></div></div>
      <div class="field"><label class="field-label">Observaciones</label><textarea id="ag-obs" placeholder="Notas de la negociación…"></textarea></div>
      <div class="btn-row"><button class="btn btn-teal" id="saveAgenda">Guardar Agenda</button><button class="btn btn-outline" id="closeModal">Cancelar</button></div>
    </div></div>`;
  }
  const a = m.agenda;
  return `
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal">
    <h3>Reprogramar agenda — ${a.cuenta}</h3>
    <div class="grid-2"><div class="field"><label class="field-label">Nueva fecha</label><input type="date" id="rp-fecha"></div>
      <div class="field"><label class="field-label">Nueva hora</label><input type="time" id="rp-hora" value="${a.hora}"></div></div>
    <div class="field"><label class="field-label">Observaciones (se añaden al historial)</label><textarea id="rp-obs" placeholder="Motivo de la reprogramación…"></textarea></div>
    <div class="btn-row"><button class="btn btn-teal" id="saveReprogramar">Guardar</button><button class="btn btn-outline" id="closeModal">Cancelar</button></div>
  </div></div>`;
}

/* ---------------- DASHBOARD (supervisor only) ---------------- */
function renderDashboard(){
  if(state.dashboardLoading || !state.dashboardData) return `<div class="page-head"><h1>Dashboard</h1></div><div class="panel"><div class="spin-state">Cargando indicadores…</div></div>`;
  const dd = state.dashboardData;
  const maxEj = Math.max(1, ...Object.values(dd.pull.byEjecutivo));
  const k = dd.agenda;
  const maxAgendaEstado = Math.max(1, k.vigentes, k.pendientes, k.vencidas, k.atendidas, k.canceladas);
  return `
  <div class="page-head"><h1>Dashboard</h1><p>Indicadores independientes por módulo — Pull y Agenda no se afectan entre sí.</p></div>
  <div class="split">
    <div class="panel" style="margin:0;">
      <h2><span class="badge badge-indigo" style="margin-right:6px;">Pull</span>Indicadores de distribución</h2>
      <div class="grid-3" style="margin-bottom:16px;">
        <div class="kpi"><div class="n">${dd.pull.total}</div><div class="l">Total cuentas</div></div>
        <div class="kpi"><div class="n">${dd.pull.disponibles}</div><div class="l">Disponibles</div></div>
        <div class="kpi"><div class="n">${dd.pull.tomadas}</div><div class="l">Tomadas</div></div>
      </div>
      <div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">Cuentas trabajadas por ejecutivo</div>
      ${Object.entries(dd.pull.byEjecutivo).map(([ej,n])=>`
        <div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${ejName(ej)}</span><b class="mono">${n}</b></div>
        <div class="progress"><div style="width:${(n/maxEj)*100}%"></div></div></div>`).join('')}
    </div>
    <div class="divider-v"></div>
    <div class="panel" style="margin:0;">
      <h2><span class="badge badge-teal" style="margin-right:6px;">Agenda</span>Indicadores de seguimiento</h2>
      <div class="grid-3" style="margin-bottom:16px;">
        <div class="kpi"><div class="n">${k.total}</div><div class="l">Total agendas</div></div>
        <div class="kpi"><div class="n">${k.seguimiento}</div><div class="l">Seguimiento</div></div>
        <div class="kpi"><div class="n">${k.promesa}</div><div class="l">A promesa</div></div>
      </div>
      <div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">Por estado de agenda</div>
      ${[['Vigente',k.vigentes],['Pendiente',k.pendientes],['Vencida',k.vencidas],['Atendida',k.atendidas],['Cancelada',k.canceladas]].map(([label,n])=>`
        <div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${label}</span><b class="mono">${n}</b></div>
        <div class="progress teal"><div style="width:${(n/maxAgendaEstado)*100}%"></div></div></div>`).join('')}
    </div>
  </div>`;
}

/* ============================= EVENTS (ventana principal) ============================= */

function bindEvents(){
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = () => {
    if(state.pullWindowRef && !state.pullWindowRef.closed) state.pullWindowRef.close();
    Object.assign(state, { auth:null, role:null, currentEjecutivo:null, agendaList:null, dashboardData:null, pullWindowRef:null });
    render();
  };

  const openPull = document.querySelector('[data-action="openPull"]');
  if(openPull) openPull.onclick = openOrFocusPullWindow;

  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=async ()=>{
    state.view=b.dataset.view;
    if(state.view==='agenda' && state.agendaList===null) await loadAgendas();
    else if(state.view==='dashboard' && !state.dashboardData) await loadDashboard();
    else render();
  });

  const newAgendaBtn = document.getElementById('newAgendaBtn');
  if(newAgendaBtn) newAgendaBtn.onclick = () => { state.agendaModal = { mode:'new', prefillCuenta:'' }; render(); };

  ['f-estatus','f-estado','f-ejecutivo','f-equipo','f-cuenta','f-desde','f-hasta'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    const key = id.replace('f-','');
    el.oninput = () => { state.agendaFilters[key] = el.value; render(); };
  });
  const clearBtn = document.getElementById('clearFilters');
  if(clearBtn) clearBtn.onclick = () => { state.agendaFilters = {estatus:'',estado:'',desde:'',hasta:'',cuenta:'',ejecutivo:'',equipo:''}; render(); };

  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = async () => {
      const id = btn.dataset.id, act = btn.dataset.act;
      if(act==='reprogramar'){ const a = state.agendaList.find(x=>x.id===id); state.agendaModal = {mode:'reprogramar', agenda:a}; render(); return; }
      btn.disabled = true;
      try{
        await apiPost('actualizarAgenda', { id, accion: act });
        showToast(act==='atender' ? 'Agenda marcada como atendida.' : 'Agenda cancelada.');
        await loadAgendas();
      }catch(err){ showToast('Error: '+err.message); btn.disabled=false; }
    };
  });

  const closeModal = document.getElementById('closeModal');
  if(closeModal) closeModal.onclick = () => { state.agendaModal = null; render(); };
  const backdrop = document.getElementById('modalBackdrop');
  if(backdrop) backdrop.onclick = e => { if(e.target===backdrop){ state.agendaModal=null; render(); } };

  const saveAgenda = document.getElementById('saveAgenda');
  if(saveAgenda) saveAgenda.onclick = async () => {
    const cuenta = document.getElementById('ag-cuenta').value.trim();
    const estatus = document.getElementById('ag-estatus').value;
    const fecha = document.getElementById('ag-fecha').value;
    const hora = document.getElementById('ag-hora').value;
    const obs = document.getElementById('ag-obs').value.trim();
    if(!cuenta || !fecha || !hora){ showToast('Completa cuenta, fecha y hora.'); return; }
    const fechaISO = new Date(fecha+'T'+hora).toISOString();
    saveAgenda.disabled = true; saveAgenda.textContent = 'Guardando…';
    try{
      await apiPost('crearAgenda', { cuenta, ejecutivoId: state.currentEjecutivo, estatus, fechaISO, obs });
      state.agendaModal = null; showToast('Agenda guardada.');
      await loadAgendas();
    }catch(err){ showToast('Error: '+err.message); saveAgenda.disabled=false; saveAgenda.textContent='Guardar Agenda'; }
  };

  const saveReprogramar = document.getElementById('saveReprogramar');
  if(saveReprogramar) saveReprogramar.onclick = async () => {
    const a = state.agendaModal.agenda;
    const fecha = document.getElementById('rp-fecha').value;
    const hora = document.getElementById('rp-hora').value;
    const obs = document.getElementById('rp-obs').value.trim();
    if(!fecha || !hora){ showToast('Indica la nueva fecha y hora.'); return; }
    const fechaISO = new Date(fecha+'T'+hora).toISOString();
    saveReprogramar.disabled = true; saveReprogramar.textContent = 'Guardando…';
    try{
      await apiPost('actualizarAgenda', { id:a.id, accion:'reprogramar', fechaISO, obs });
      state.agendaModal = null; showToast('Agenda reprogramada.');
      await loadAgendas();
    }catch(err){ showToast('Error: '+err.message); saveReprogramar.disabled=false; saveReprogramar.textContent='Guardar'; }
  };
}

render();
</script>
</body>
</html>
